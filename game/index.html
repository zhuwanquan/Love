<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>一年·房间 — RC-Edu-7</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="一年·房间">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部状态栏 -->
    <header id="header">
      <span id="scene-title">一年·房间</span>
      <span id="day-indicator">Day 1</span>
    </header>

    <!-- 对话区域 -->
    <main id="chat-area">
      <div id="message-list"></div>
    </main>

    <!-- 选项区域 -->
    <div id="choices-area" class="hidden"></div>

    <!-- 点击继续提示 -->
    <div id="tap-hint" class="hidden">
      <span>点击继续</span>
    </div>
  </div>

  <!-- 脚本数据：全部8个节点日 + 4个结局 -->
  <script src="data/day1.js"></script>
  <script src="data/day2.js"></script>
  <script src="data/day3.js"></script>
  <script src="data/day4.js"></script>
  <script src="data/day5.js"></script>
  <script src="data/day6.js"></script>
  <script src="data/day7.js"></script>
  <script src="data/day8.js"></script>
  <!-- 游戏引擎 -->
  <script src="js/engine.js"></script>
  <script>
    // 合并全部剧本 → 启动
    const engine = new GameEngine();
    engine.init('message-list', 'choices-area', 'tap-hint', 'scene-title', 'day-indicator');

    // 按顺序加载所有天
    const allScripts = [
      DAY1_SCRIPT,
      DAY2_SCRIPT,
      DAY3_SCRIPT,
      DAY4_SCRIPT,
      DAY5_SCRIPT,
      DAY6_SCRIPT,
      DAY7_SCRIPT,
      DAY8_SCRIPT
    ];

    allScripts.forEach(script => engine.loadScript(script));

    // 从第一天开始
    engine.updateMeta('一年·房间', 'Day 1');
    engine.start('day1_opening');
  </script>

  <!-- 注册 Service Worker（离线缓存） -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('✅ PWA 离线缓存就绪'))
        .catch(() => console.log('⚠ SW 注册失败（可能本地开发环境）'));
    }
  </script>
</body>
</html>
