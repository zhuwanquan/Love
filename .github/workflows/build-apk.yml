name: Build Android APK

on:
  push:
    branches: [main, v2-romance]
    paths:
      - 'game/www/**'
      - 'game/package.json'
      - 'game/capacitor.config.json'
      - 'game/package-lock.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

# 确保单个 workflow 运行，避免并发冲突
concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 npm 依赖
        run: npm install --registry=https://registry.npmmirror.com

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 写入 Android SDK 路径
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

      - name: 同步 Capacitor（web 资产 → android）
        run: npx cap sync android

      - name: 构建 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: RC7-恋爱模拟-debug
          path: game/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
